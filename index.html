<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cap Permis B – suis tes réflexes de conduite jusqu'à l'examen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#F5F7F9; --ink:#15202A; --muted:#55636F; --line:#D3DAE1;
  --sign:#0B4F9E; --on-sign:#FFFFFF;
  --c0:#D2452C; --on-c0:#FFFFFF;
  --c1:#E5AC00; --on-c1:#1E1600;
  --c2:#1E8449; --on-c2:#FFFFFF;
  --cn:#CBD3DA;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161C; --surface:#17212A; --surface2:#1D2933; --ink:#E9EEF2; --muted:#9AA8B4; --line:#2C3B48;
    --sign:#6AAEFF; --on-sign:#07131F;
    --c0:#FF8068; --on-c0:#2B0C05;
    --c1:#F2C230; --on-c1:#241A00;
    --c2:#52CB8B; --on-c2:#05200F;
    --cn:#33434F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#17212A; --surface2:#1D2933; --ink:#E9EEF2; --muted:#9AA8B4; --line:#2C3B48;
  --sign:#6AAEFF; --on-sign:#07131F;
  --c0:#FF8068; --on-c0:#2B0C05;
  --c1:#F2C230; --on-c1:#241A00;
  --c2:#52CB8B; --on-c2:#05200F;
  --cn:#33434F;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--font-body)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;line-height:1.05}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--sign);color:var(--on-sign);padding:8px 14px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* En-tête et navigation */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font:700 1.55rem var(--font-display);letter-spacing:.01em;background:none;border:0;padding:0;cursor:pointer}
.nav{display:flex;gap:2px;margin-left:auto}
.nav button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:9px 13px;border-radius:10px;font-weight:600;font-size:.95rem;color:var(--muted);cursor:pointer}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--surface)}
.nav svg,.theme svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.theme{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.theme:hover{background:var(--surface2)}
main{padding-bottom:40px;outline:none}

/* Boutons et champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--sign);color:var(--on-sign);border:1px solid var(--sign);border-radius:10px;padding:11px 18px;font-weight:700;font-size:.95rem;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2);filter:none}
.btn.danger{background:transparent;color:var(--ink);border-color:var(--c0)}
.btn.small{padding:7px 12px;min-height:36px;font-size:.85rem}
.link{background:none;border:0;padding:0;color:var(--sign);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.inp{font:inherit;padding:9px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-height:44px;width:100%}
textarea.inp{resize:vertical;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
.field .hint,.hint{font-weight:400;color:var(--muted);font-size:.88rem}
.muted{color:var(--muted)}

/* Composants de progression */
.stack{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--cn)}
.stack i{display:block;min-width:3px}
.s0{background:var(--c0)} .s1{background:var(--c1)} .s2{background:var(--c2)} .sn{background:var(--cn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;margin:12px 0 0;padding:0}
.lg{display:inline-flex;align-items:center;gap:8px;font-size:.92rem;background:none;border:0;padding:3px 0;color:var(--ink)}
button.lg{cursor:pointer}
button.lg:hover span{text-decoration:underline;text-underline-offset:3px}
.sw{width:12px;height:12px;border-radius:3px;flex:none;display:inline-block}
.bar{display:flex;gap:1px;height:8px;border-radius:4px;overflow:hidden;background:var(--cn);width:100%}
.bar i{display:block}
.defs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 0;padding:0;list-style:none}
.defs li{border-top:4px solid var(--cn);padding-top:8px;font-size:.9rem;color:var(--muted)}
.defs li b{display:block;color:var(--ink);font-size:.95rem}
.defs .d0{border-color:var(--c0)} .defs .d1{border-color:var(--c1)} .defs .d2{border-color:var(--c2)}
@media(max-width:640px){.defs{grid-template-columns:1fr}}

/* Bilan */
.hero{display:grid;grid-template-columns:minmax(280px,400px) minmax(0,1fr);gap:44px;align-items:center;padding:34px 0 26px}
.cluster{position:relative;background:#121A21;color:#EAF0F4;border-radius:26px;padding:22px 18px 40px;border:1px solid #26333E;overflow:hidden}
.cluster::after{content:"";position:absolute;left:0;right:0;bottom:16px;height:3px;background:repeating-linear-gradient(90deg,#EAF0F4 0 18px,transparent 18px 36px);opacity:.3}
.cluster svg{display:block;width:100%;height:auto}
.g-zone{fill:none;stroke-width:14}
.z0{stroke:#E8654B} .z1{stroke:#F1BE2C} .z2{stroke:#4CC88A}
.g-tick{stroke:#5F6E7A;stroke-width:2;stroke-linecap:round}
.g-lab{fill:#93A1AD;font:600 13px var(--font-body)}
.g-num{fill:#EAF0F4;font:700 54px var(--font-display);letter-spacing:0}
.g-pc{fill:#93A1AD;font:600 20px var(--font-display)}
.g-target{stroke:#FFFFFF;stroke-width:3.5;stroke-linecap:round}
.needle{transform-origin:160px 160px;transition:transform 1.3s cubic-bezier(.16,.84,.24,1)}
.needle line{stroke:#EAF0F4;stroke-width:4;stroke-linecap:round}
.g-hub{fill:#EAF0F4}.g-hub2{fill:#121A21}
.g-cap{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.88rem;color:#B5C1CB;margin-top:2px}
.g-key{display:inline-block;width:3px;height:16px;background:#fff;border-radius:2px}
.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);max-width:19ch;margin-bottom:12px}
.lede{font-size:1.06rem;color:var(--muted);max-width:56ch}
.hero .stack{margin-top:22px}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:22px}
.exam{color:var(--muted);font-size:.95rem}
@media(max-width:860px){.hero{grid-template-columns:1fr;gap:26px;padding-top:22px}.cluster{max-width:440px}}

.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:24px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.panel h2{font-size:1.6rem;margin-bottom:4px}
.panel>.hint{margin-bottom:14px}
.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:11px;top:16px;bottom:16px;border-left:2px dashed var(--line)}
.stop{display:grid;grid-template-columns:24px minmax(0,1fr) 96px 44px;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:8px 6px 8px 0;cursor:pointer;border-radius:8px}
.stop:hover{background:var(--surface2)}
.stop-n{font-size:.85rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.node{width:24px;height:24px;display:grid;place-items:center;position:relative;z-index:1}
.node::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--nc,var(--cn))}
.stop:hover .node::before{background:var(--surface2)}
.node.on::before{background:var(--nc)}
.lesson{list-style:none;margin:12px 0 16px;padding:0}
.lesson li{padding:10px 0;border-top:1px solid var(--line)}
.lesson small{display:block;color:var(--muted);font-size:.8rem}
.dom-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.dom-row small{color:var(--muted)}
.dom-row .pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* Pages internes */
.page-head{padding:30px 0 6px}
.page-head h1{font-size:clamp(2rem,4.4vw,2.8rem);margin-bottom:8px}
.sumbar{position:sticky;top:0;z-index:6;background:var(--bg);padding:12px 0;margin-top:14px;border-bottom:1px solid var(--line)}
.sum-line{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sum-line .big{font:700 2.2rem var(--font-display);line-height:1}
.sum-line .t{color:var(--muted);font-size:.92rem}
.sumbar .legend{margin-top:8px}
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:end;margin:18px 0 0}
.filters .field{min-width:200px;flex:1 1 220px;max-width:340px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.86rem;cursor:pointer;min-height:38px}
.chip:hover{background:var(--surface2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grp{margin-top:30px}
.grp-h{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.grp-h h2{font-size:1.7rem}
.grp-stat{display:flex;align-items:center;gap:12px;font-size:.88rem;color:var(--muted)}
.grp-stat .bar{width:110px}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 22px;align-items:center;padding:14px 0 14px 14px;border-bottom:1px solid var(--line);border-left:4px solid transparent}
.row[data-l="0"]{border-left-color:var(--c0)} .row[data-l="1"]{border-left-color:var(--c1)} .row[data-l="2"]{border-left-color:var(--c2)}
.row-meta{display:flex;gap:12px;font-size:.8rem;color:var(--muted);margin-bottom:2px}
.row-text{font-weight:500}
.row-ctl{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.lv{border:0;border-right:1px solid var(--line);background:transparent;font-weight:600;font-size:.82rem;padding:8px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
.lv:last-child{border-right:0}
.lv:hover{background:var(--surface2)}
.lv[aria-pressed="true"].l0{background:var(--c0);color:var(--on-c0)}
.lv[aria-pressed="true"].l1{background:var(--c1);color:var(--on-c1)}
.lv[aria-pressed="true"].l2{background:var(--c2);color:var(--on-c2)}
.ico{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.ico:hover{background:var(--surface2);color:var(--ink)}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:var(--on-sign)}
.ico[aria-pressed="true"] svg{fill:currentColor}
.ico.has-note{color:var(--sign);border-color:var(--sign)}
.note{grid-column:1/-1}
@media(max-width:760px){
  .row{grid-template-columns:1fr}
  .row-ctl{flex-wrap:wrap}
  .seg{flex:1 1 100%}
  .lv{flex:1;padding:8px 4px}
  .grp-stat .bar{width:80px}
}
.empty{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);margin-top:24px}
.empty .btn{margin-top:12px}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;border:1px solid var(--line);border-left:4px solid var(--sign);background:var(--surface);border-radius:10px;padding:14px 16px;margin-top:20px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* Évolution */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 12px var(--font-body)}
.chart .ln{fill:none;stroke:var(--sign);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--sign);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--sign);stroke-width:3}
.chart .tg{stroke:var(--c2);stroke-width:2;stroke-dasharray:6 5}
.chart .tgl{fill:var(--c2);font:700 12px var(--font-body)}
.kpis{display:flex;flex-wrap:wrap;gap:8px 32px;margin:6px 0 14px}
.kpi b{display:block;font:700 2rem var(--font-display);line-height:1.1}
.kpi span{color:var(--muted);font-size:.86rem}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:24px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.recent{list-style:none;margin:8px 0 0;padding:0}
.recent li{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:.9rem}
.recent time{color:var(--muted);font-size:.82rem}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.feel{display:flex;flex-wrap:wrap;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .wide{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
.entry{border-top:1px solid var(--line);padding:14px 0}
.entry-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:6px}
.entry-h b{font-weight:700}
.entry p{font-size:.94rem}
.entry p span{font-weight:700}
.entry .btn{margin-left:auto}


/* Questions d'examen */
.tabs{margin-top:20px}
.tabs .chip{padding:10px 18px;font-size:.92rem}
.fpick{margin-top:18px}
.pick-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-top:12px}
.pick-row .field{width:200px}
.err{font-weight:600;margin-top:10px;min-height:1.4em}
.err:not(:empty){border-left:4px solid var(--c0);padding-left:10px}
.fiche-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:28px 0 0}
.fiche-h h2{font-size:clamp(2.2rem,6vw,3.4rem)}
.fiche-tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.step{margin-top:26px}
.step-t{display:flex;align-items:center;gap:12px;font:700 1.55rem var(--font-display);padding-bottom:8px;border-bottom:2px solid var(--ink)}
.step-n{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 1.05rem var(--font-display);flex:none}
.qcard{padding:14px 0 16px 14px;border-left:4px solid transparent;border-bottom:1px solid var(--line)}
.qcard[data-l="0"]{border-left-color:var(--c0)} .qcard[data-l="1"]{border-left-color:var(--c1)} .qcard[data-l="2"]{border-left-color:var(--c2)}
.q-meta{margin:0 0 6px}
.q-text{font-weight:600;font-size:1.1rem;line-height:1.4;margin:0 0 6px}
details.ans summary{cursor:pointer;color:var(--sign);font-weight:700;min-height:44px;display:flex;align-items:center;width:fit-content}
.ans-body{margin:2px 0 10px;padding:12px 16px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
.q-rate{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px}
.q-again{margin-top:8px;font-size:.86rem;color:var(--muted)}
.qcats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:18px}
.qcat b{display:block;font-size:.9rem;margin-bottom:6px}
.qcat small{color:var(--muted);display:block;margin-top:5px;font-size:.82rem}
@media(max-width:700px){.qcats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fiche-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 6px;margin-top:12px}
.fiche-row-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin-bottom:6px}
.fnum{font:700 1.9rem var(--font-display);line-height:1}
.fiche-row-h .link{margin-left:auto}
.fq{padding:10px 0 4px;border-top:1px solid var(--line)}
.fq small{color:var(--muted);font-weight:600;font-size:.8rem;display:flex;align-items:center;gap:8px}
.fq .q-text{font-size:1rem;margin:4px 0 0}
.fq details.ans summary{min-height:40px}
.count-line{margin:14px 0 0}


/* Mode d'emploi */
.help-wrap{max-width:820px}
.help-step p{margin:10px 0 0;max-width:62ch}
.help-step .btn{margin-top:14px}
.tips{list-style:none;margin:12px 0 0;padding:0}
.tips li{padding:12px 0 12px 16px;border-top:1px solid var(--line);border-left:4px solid var(--sign)}
.tips li:first-child{margin-top:0}
.tips b{display:block}
.rhythm{margin-top:28px}


/* Mentions légales */
.foot-links{display:flex;flex-wrap:wrap;gap:6px 22px}
.legal main,.legal-body{display:block}
.legal-body h2{font:700 1.55rem/1.1 var(--font-display);margin:34px 0 0;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.legal-body p,.legal-body ul{margin:10px 0 0;max-width:68ch}
.legal-body ul{padding-left:1.2em}
.legal-body li{margin-top:6px}
.legal-body a{color:var(--sign);text-underline-offset:3px}
.legal-body address{font-style:normal;margin-top:10px}
.legal-body .upd{color:var(--muted);font-size:.92rem;margin:0}


/* Sauvegarde et Jour J */
.gear{display:none}
.theme[aria-current="page"]{background:var(--ink);color:var(--surface)}
.banner .tools{margin-top:0}
.jj-hero{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;margin-top:22px}
.jj-count{font:700 clamp(4.5rem,15vw,8rem)/.9 var(--font-display)}
.jj-hero p{max-width:46ch}
.jj-checks{list-style:none;margin:6px 0 0;padding:0}
.jj-checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.jj-checks input{width:22px;height:22px;margin-top:2px;accent-color:var(--sign);flex:none}
.jj-checks input:checked + span{color:var(--muted);text-decoration:line-through}
.jj-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.jj-sec{margin-top:34px}
.jj-sec>h2{font:700 1.9rem var(--font-display);padding-bottom:8px;border-bottom:2px solid var(--ink)}
.jj-note{margin-top:10px;max-width:62ch}
.br-stage{position:relative;height:230px;display:grid;place-items:center;margin:6px 0 10px}
.br-circle{width:180px;height:180px;border-radius:50%;border:4px solid var(--sign);background:var(--surface2);transform:scale(.6);transition-property:transform;transition-timing-function:ease-in-out;transition-duration:4s}
.br-text{position:absolute;text-align:center;display:flex;flex-direction:column;gap:2px}
.br-text strong{font:700 1.7rem var(--font-display)}
.br-text span{font:700 2.4rem var(--font-display);line-height:1}
.phrase{font:700 clamp(1.7rem,4.4vw,2.6rem)/1.1 var(--font-display);border-left:6px solid var(--sign);padding:6px 0 6px 18px;margin:14px 0 16px;max-width:24ch}
.strong-list{margin:10px 0 0;padding-left:1.2em}
.strong-list li{margin-top:6px}
.visu{padding-left:1.3em;margin:10px 0 0;max-width:62ch}
.visu li{margin-top:10px}
@media(max-width:760px){
  .top-in{gap:8px}
  .gear{display:grid}
  .nav .nav-set{display:none}
}

/* Réglages */
.stackv{display:flex;flex-direction:column;gap:24px;max-width:820px;margin-top:22px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--sign)}
.check .muted{margin-left:auto;font-size:.85rem}
.range{display:flex;align-items:center;gap:14px}
.range input{flex:1;accent-color:var(--sign)}
.range output{font:700 1.5rem var(--font-display);min-width:3.2ch;text-align:right}
.h3{font:700 1.15rem var(--font-body);margin:18px 0 6px}
footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--muted);font-size:.86rem}
footer p+p{margin-top:6px}
footer .copy{color:var(--ink);font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Mobile : navigation en bas */
@media(max-width:760px){
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .nav button{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 2px;flex:1;border-radius:8px;min-width:0}
  .top-in .help{margin-left:auto}
  body{padding-bottom:76px}
  #toast{bottom:92px}
  .stop{grid-template-columns:24px minmax(0,1fr) 70px 40px;gap:8px}
}
@media(min-width:761px){.theme{margin-left:0}}
@media(max-width:400px){.brand{font-size:1.3rem;gap:8px}.top-in{gap:6px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000;padding:0}
  .top,.nav,.no-print,.row-ctl,footer,#toast{display:none!important}
  .row{break-inside:avoid;border-left-color:#000!important}
  .note{display:none}
}

re : symbole de compteur de vitesse (jaune-orangé)."},{"id":"i29","cat":"int","q":"Faites fonctionner l'essuie-glace arrière du véhicule.","a":""},{"id":"i30","cat":"int","q":"Indiquez où se situent les attaches de type Isofix dans le véhicule.","a":"Pour info : ces attaches sont obligatoires sur les véhicules neufs depuis 2011."},{"id":"i31","cat":"int","q":"Montrez sur le tableau de bord le voyant indiquant une baisse de pression d'air d'un pneumatique.","a":"Pour info : obligatoire sur tous les véhicules neufs mis en circulation à compter du 01/11/2014."},{"id":"e1","cat":"ext","q":"Montrez où s'effectue le remplissage du produit lave-glace.","a":"Ouvrir le capot et montrer le bocal. Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut l'aider."},{"id":"e2","cat":"ext","q":"Contrôlez l'état du flanc sur l'un des pneumatiques.","a":"En bon état (toute anomalie doit être signalée)."},{"id":"e3","cat":"ext","q":"Vérifiez l'état et la propreté des plaques d'immatriculation.","a":"Plaques avant et arrière propres et en bon état (toute anomalie doit être signalée)."},{"id":"e4","cat":"ext","q":"Montrez où s'effectue le contrôle du niveau du liquide de frein.","a":"Montrer que le niveau est entre le mini et le maxi. Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut l'aider."},{"id":"e5","cat":"ext","q":"Contrôlez l'état de tous les balais d'essuie-glace du véhicule.","a":""},{"id":"e6","cat":"ext","q":"Montrez où s'effectue le remplissage du liquide de refroidissement.","a":"Ouvrir le capot et montrer le bocal. Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut l'aider."},{"id":"e7","cat":"ext","q":"Contrôlez l'état, la propreté et le fonctionnement de tous les clignotants côté trottoir.","a":"Éléments propres, en bon état et qui fonctionnent (toute anomalie doit être signalée)."},{"id":"e8","cat":"ext","q":"Contrôlez l'état, la propreté et le fonctionnement du ou des feux de brouillard arrière.","a":"Éléments propres, en bon état et qui fonctionnent (toute anomalie doit être signalée)."},{"id":"e9","cat":"ext","q":"Contrôlez l'état, la propreté et le fonctionnement des feux de détresse à l'avant et à l'arrière.","a":"Éléments propres, en bon état et qui fonctionnent (toute anomalie doit être signalée)."},{"id":"e10","cat":"ext","q":"Contrôlez l'état, la propreté et le fonctionnement des feux de route.","a":"Éléments propres, en bon état et qui fonctionnent (toute anomalie doit être signalée)."},{"id":"e11","cat":"ext","q":"Montrez où doit s'effectuer le contrôle du niveau d'huile moteur.","a":"Montrer la jauge (pas de manipulation exigée). Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut l'aider."},{"id":"e12","cat":"ext","q":"Montrez l'emplacement de la batterie du véhicule.","a":"Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut l'aider."},{"id":"e13","cat":"ext","q":"Contrôlez l'état, la propreté et le fonctionnement des feux de croisement.","a":"Éléments propres, en bon état et qui fonctionnent (toute anomalie doit être signalée)."},{"id":"e14","cat":"ext","q":"Vérifiez l'état et la propreté des dispositifs réfléchissants.","a":"Dispositifs propres et en bon état (toute anomalie doit être signalée)."},{"id":"e15","cat":"ext","q":"Contrôlez l'état, la propreté et le fonctionnement des feux de position à l'avant et à l'arrière du véhicule.","a":"Éléments propres, en bon état et qui fonctionnent (toute anomalie doit être signalée)."},{"id":"e16","cat":"ext","q":"Sur le flanc d'un pneumatique, désignez le repère du témoin d'usure de la bande de roulement.","a":"Désigner le repère. Toute anomalie doit être signalée."},{"id":"e17","cat":"ext","q":"Ouvrez la trappe à carburant et/ou vérifiez la bonne fermeture du bouchon.","a":"En bon état (toute anomalie doit être signalée)."},{"id":"e18","cat":"ext","q":"Montrez où s'effectue le remplissage de l'huile moteur.","a":"Montrer le bouchon de remplissage. Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut l'aider."},{"id":"e19","cat":"ext","q":"À l'aide de la plaque indicative, donnez la pression préconisée pour les pneumatiques arrière, véhicule chargé.","a":""},{"id":"e20","cat":"ext","q":"Vérifiez le fonctionnement de l'éclairage de la plaque d'immatriculation à l'arrière.","a":"Toute anomalie doit être signalée."},{"id":"e21","cat":"ext","q":"Indiquez où se situe la sécurité enfant sur l'une des portières à l'arrière du véhicule.","a":""},{"id":"e22","cat":"ext","q":"Avec l'assistance de l'accompagnateur, contrôlez l'état, la propreté et le fonctionnement du ou des feux de recul.","a":"Éléments propres, en bon état et qui fonctionnent (toute anomalie doit être signalée)."},{"id":"e23","cat":"ext","q":"Avec l'assistance de l'accompagnateur, contrôlez l'état, la propreté et le fonctionnement des feux de stop.","a":"Éléments propres, en bon état et qui fonctionnent (toute anomalie doit être signalée)."},{"id":"e24","cat":"ext","q":"Ouvrez et refermez le capot, puis vérifiez sa bonne fermeture.","a":""},{"id":"e25","cat":"ext","q":"Procédez à l'ouverture du capot puis à sa fermeture en vous assurant de son verrouillage.","a":""},{"id":"e26","cat":"ext","q":"Ouvrez et refermez le coffre, puis vérifiez sa bonne fermeture.","a":""},{"id":"e27","cat":"ext","q":"Montrez où se situent les gicleurs de lave-glace avant.","a":""},{"id":"e28","cat":"ext","q":"Montrez où s'effectue le changement d'une ampoule à l'avant du véhicule.","a":"Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut l'aider."},{"id":"e29","cat":"ext","q":"Montrez où s'effectue le changement d'une ampoule à l'arrière du véhicule.","a":""},{"id":"e30","cat":"ext","q":"Vérifiez l'état, la propreté et le fonctionnement des feux diurnes.","a":"Éléments propres, en bon état et qui fonctionnent (toute anomalie doit être signalée)."},{"id":"e31","cat":"ext","q":"Vérifiez la présence du triangle de pré-signalisation.","a":""},{"id":"q1","cat":"qser","q":"Pourquoi doit-on régler la hauteur des feux ?","a":"Pour ne pas éblouir les autres usagers."},{"id":"q2","cat":"qser","q":"Pourquoi est-il préférable d'utiliser un liquide lave-glace spécial en hiver ?","a":"Pour éviter le gel du liquide."},{"id":"q3","cat":"qser","q":"Quel est l'intérêt de la position « nuit » du rétroviseur ?","a":"Ne pas être ébloui par les feux du véhicule qui suit."},{"id":"q4","cat":"qser","q":"Citez un endroit où l'on peut trouver les pressions préconisées pour les pneumatiques.","a":"Sur une plaque sur une portière, dans la notice d'utilisation du véhicule, ou au niveau de la trappe à carburant."},{"id":"q5","cat":"qser","q":"Comment détecter l'usure des essuie-glaces en circulation ?","a":"En cas de pluie, ils laissent des traces sur le pare-brise."},{"id":"q6","cat":"qser","q":"Quelles sont les précautions à prendre en cas d'installation d'un porte-vélo ?","a":"La plaque d'immatriculation et les feux doivent rester visibles."},{"id":"q7","cat":"qser","q":"En cas de panne ou d'accident, quel autre accessoire de sécurité est obligatoire ?","a":"Le triangle de pré-signalisation."},{"id":"q8","cat":"qser","q":"Quelle est la conséquence d'un niveau insuffisant du liquide de frein ?","a":"Une perte d'efficacité du freinage."},{"id":"q9","cat":"qser","q":"Quels sont les deux autres documents obligatoires à présenter lors d'un contrôle des forces de l'ordre (en plus de la carte grise) ?","a":"L'attestation d'assurance et le permis de conduire."},{"id":"q9b","cat":"qser","q":"Quels sont les deux autres documents obligatoires à présenter lors d'un contrôle des forces de l'ordre (en plus de l'attestation d'assurance) ?","a":"Le certificat d'immatriculation (« carte grise » est accepté) et le permis de conduire."},{"id":"q10","cat":"qser","q":"Quel est le risque de circuler avec des balais d'essuie-glace défectueux ?","a":"Une mauvaise visibilité en cas d'intempéries."},{"id":"q11","cat":"qser","q":"Quelles sont les précautions à prendre lors du remplissage du réservoir ?","a":"Arrêter le moteur, ne pas fumer, ne pas téléphoner."},{"id":"q12","cat":"qser","q":"Quel est le danger si l'on complète le niveau du liquide lorsque le moteur est chaud ?","a":"Un risque de brûlure."},{"id":"q13","cat":"qser","q":"Quelle peut être la conséquence d'une panne de dégivrage de la lunette arrière ?","a":"Une insuffisance ou une absence de visibilité vers l'arrière."},{"id":"q14","cat":"qser","q":"Quelle est la signification d'un clignotement plus rapide ?","a":"Non-fonctionnement de l'une des ampoules."},{"id":"q15","cat":"qser","q":"Quelles sont les conditions à respecter pour contrôler (ou compléter) le niveau d'huile ?","a":"Moteur froid et sur un terrain plat."},{"id":"q16","cat":"qser","q":"Dans quels cas utilise-t-on les feux de brouillard arrière ?","a":"Par temps de brouillard et de neige."},{"id":"q17","cat":"qser","q":"À partir de quel taux d'alcoolémie, en période de permis probatoire, est-on en infraction ?","a":"0,2 g/l, soit 0 verre, car dès le premier verre ce seuil peut être dépassé."},{"id":"q18","cat":"qser","q":"Dans quels cas doit-on utiliser les feux de détresse ?","a":"En cas de panne, d'accident ou de ralentissement important."},{"id":"q19","cat":"qser","q":"Pourquoi est-il important de bien régler son volant ? Citez deux exemples.","a":"Le confort de conduite, l'accessibilité aux commandes, la visibilité du tableau de bord, l'efficacité des airbags."},{"id":"q20","cat":"qser","q":"Citez un cas d'utilisation de l'appel lumineux.","a":"Pour avertir de son approche, en cas de danger, ou à la place de l'avertisseur sonore."},{"id":"q21","cat":"qser","q":"Citez deux éléments complémentaires permettant un désembuage efficace.","a":"La commande de vitesse de ventilation, la commande d'air chaud, la climatisation."},{"id":"q22","cat":"qser","q":"Quel est le principal risque d'un manque d'huile moteur ?","a":"Un risque de détérioration ou de casse du moteur."},{"id":"q23","cat":"qser","q":"Qu'est-ce qui peut provoquer la décharge de la batterie, moteur éteint ?","a":"Les feux ou accessoires électriques en fonctionnement."},{"id":"q24","cat":"qser","q":"Quelle est la solution en cas de panne de batterie pour démarrer le véhicule sans le déplacer ?","a":"Brancher une deuxième batterie en parallèle (les + ensemble et les − ensemble) ou remplacer la batterie."},{"id":"q25","cat":"qser","q":"Quel est le risque de circuler avec un frein de parking mal desserré ?","a":"Une dégradation du système de freinage."},{"id":"q26","cat":"qser","q":"Quelles sont les conséquences d'un mauvais réglage des feux de croisement ?","a":"Une mauvaise vision vers l'avant et un risque d'éblouissement des autres usagers."},{"id":"q27","cat":"qser","q":"Quelle est la conséquence d'une température trop élevée du liquide de refroidissement ?","a":"Une surchauffe ou une casse moteur."},{"id":"q28","cat":"qser","q":"Quelle est l'utilité des dispositifs réfléchissants ?","a":"Rendre le véhicule visible la nuit."},{"id":"q29","cat":"qser","q":"Quelle précaution prendre pour que les enfants installés à l'arrière ne puissent pas ouvrir leur portière ?","a":"Actionner la sécurité enfant sur les deux portières arrière."},{"id":"q30","cat":"qser","q":"Par temps clair, à quelle distance les feux de position doivent-ils être visibles ?","a":"À 150 mètres."},{"id":"q31","cat":"qser","q":"Qu'est-ce que l'aquaplanage, et quelle peut être sa conséquence ?","a":"La présence d'un film d'eau entre le pneumatique et la chaussée, pouvant entraîner une perte de contrôle du véhicule."},{"id":"q32","cat":"qser","q":"Sans actionner la commande du régulateur, comment le désactiver rapidement ?","a":"En appuyant sur la pédale de frein ou d'embrayage."},{"id":"q33","cat":"qser","q":"Dans quel cas peut-on utiliser l'avertisseur sonore en agglomération ?","a":"En cas de danger immédiat."},{"id":"q34","cat":"qser","q":"Dans quelle situation doit-on désactiver l'airbag du passager avant ?","a":"Lors du transport d'un enfant à l'avant dans un siège auto placé dos à la route."},{"id":"q35","cat":"qser","q":"À quelle fréquence est-il préconisé de vérifier la pression des pneumatiques ?","a":"Chaque mois pour une utilisation normale du véhicule, et avant chaque long trajet."},{"id":"q36","cat":"qser","q":"En règle générale, à partir de quel âge un enfant peut-il être installé sur le siège passager avant ?","a":"10 ans."},{"id":"q37","cat":"qser","q":"Un défaut d'éclairage de la plaque d'immatriculation lors du contrôle technique entraîne-t-il une contre-visite ?","a":"Oui."},{"id":"q38","cat":"qser","q":"Si la sécurité enfant est enclenchée, est-il possible d'ouvrir la portière arrière depuis l'extérieur ?","a":"Oui."},{"id":"q39","cat":"qser","q":"Peut-on utiliser les feux de brouillard arrière par forte pluie ?","a":"Non."},{"id":"q40","cat":"qser","q":"Quelles sont les deux utilités des feux de recul ?","a":"Éclairer la zone de recul la nuit et avertir les autres usagers de la manœuvre."},{"id":"q41","cat":"qser","q":"Quelle est l'utilité de l'appui-tête ?","a":"Retenir le mouvement de la tête en cas de choc et limiter les blessures."},{"id":"q42","cat":"qser","q":"Quelle est la conséquence en cas de panne des feux de stop ?","a":"Un manque d'information pour les usagers qui suivent et un risque de collision."},{"id":"q43","cat":"qser","q":"Quelle est la différence entre un voyant orange et un voyant rouge ?","a":"Rouge : une anomalie de fonctionnement ou un danger. Orange : un élément important."},{"id":"q44","cat":"qser","q":"En roulant, quel est le risque d'une mauvaise fermeture du capot ?","a":"Une ouverture du capot pouvant entraîner un accident."},{"id":"q45","cat":"qser","q":"Quel peut être le risque de maintenir le recyclage de l'air de manière prolongée ?","a":"Une mauvaise visibilité, à cause de la buée sur les surfaces vitrées."},{"id":"q46","cat":"qser","q":"Quel est le principal risque d'une absence de liquide lave-glace ?","a":"Une mauvaise visibilité."},{"id":"q47","cat":"qser","q":"Quel est le risque de maintenir les feux de route lors d'un croisement avec d'autres usagers ?","a":"L'éblouissement des autres usagers."},{"id":"q48","cat":"qser","q":"Quelle est l'utilité des feux diurnes ?","a":"Rendre le véhicule plus visible le jour."},{"id":"q49","cat":"qser","q":"En cas d'accident, dans quel délai le constat amiable doit-il être transmis à l'assureur ?","a":"5 jours."},{"id":"q50","cat":"qser","q":"Utilise-t-on le triangle de pré-signalisation sur autoroute ?","a":"Non."},{"id":"q51","cat":"qser","q":"Quelles sont les conséquences en cas de panne d'un feu de croisement ?","a":"Une mauvaise visibilité et le risque d'être confondu avec un deux-roues."},{"id":"q52","cat":"qser","q":"Quelle est l'utilité d'un limiteur de vitesse ?","a":"Ne pas dépasser la vitesse programmée par le conducteur."},{"id":"q53","cat":"qser","q":"Quelles sont les conséquences en cas de panne d'un feu de position arrière ?","a":"Être mal vu et un risque de collision."},{"id":"q54","cat":"qser","q":"Pour une bonne visibilité vers l'arrière par temps de pluie, en plus de l'essuie-glace, quelle commande peut-on actionner ?","a":"La commande de désembuage arrière (le terme « dégivrage » peut la remplacer)."},{"id":"q55","cat":"qser","q":"Avec un poids important dans le coffre, quelles précautions prendre pour les pneumatiques et l'éclairage avant ?","a":"Augmenter la pression des pneumatiques et régler la hauteur des feux avant."},{"id":"q56","cat":"qser","q":"Peut-on fixer tous les sièges enfant sur des attaches de type Isofix ?","a":"Non, uniquement ceux compatibles avec ce type d'attache."},{"id":"q57","cat":"qser","q":"Quels sont les risques de circuler avec des objets sur la plage arrière ?","a":"Une mauvaise visibilité vers l'arrière et un risque de projection en cas de freinage brusque ou de choc."},{"id":"q58","cat":"qser","q":"Pour un capot qui s'ouvre depuis l'avant, quelle est l'utilité du dispositif de sécurité ?","a":"Empêcher l'ouverture du capot en circulation en cas de mauvais verrouillage."},{"id":"q59","cat":"qser","q":"Quelle est la principale conséquence d'un dispositif de lave-glace défaillant ?","a":"Une mauvaise visibilité, car on ne peut plus nettoyer le pare-brise."},{"id":"s1","cat":"sec","q":"Comment et pourquoi protéger une zone de danger en cas d'accident de la route ?","a":"En délimitant clairement et largement la zone de danger, de façon visible, pour protéger les victimes et éviter un sur-accident."},{"id":"s2","cat":"sec","q":"Quels comportements adopter en cas de diffusion du signal d'alerte du SAIP (Système d'Alerte et d'Information des Populations) ?","a":"Se mettre en sécurité ; s'informer via les médias et les sites des autorités dès que possible ; respecter les consignes des autorités."},{"id":"s3","cat":"sec","q":"Comment est composé le signal d'alerte du SAIP diffusé par les sirènes ?","a":"Deux codes distincts : le Signal National d'Alerte (SNA), variation du signal sur trois cycles successifs, et le signal de fin d'alerte, signal continu."},{"id":"s4","cat":"sec","q":"Sur autoroute, comment indiquer avec précision les lieux de l'accident depuis un téléphone portable ?","a":"En indiquant le numéro de l'autoroute, le sens de circulation et le point kilométrique."},{"id":"s5","cat":"sec","q":"Comment vérifier la respiration d'une victime ?","a":"Regarder si le ventre et la poitrine se soulèvent et sentir de l'air à l'expiration."},{"id":"s6","cat":"sec","q":"Qu'est-ce qu'une perte de connaissance ?","a":"C'est lorsque la victime ne répond pas et ne réagit pas, mais respire."},{"id":"s7","cat":"sec","q":"Si un dégagement d'urgence de la victime est nécessaire, où doit-elle être déplacée ?","a":"Dans un endroit suffisamment éloigné du danger et de ses conséquences."},{"id":"s8","cat":"sec","q":"En cas de panne ou d'accident, quel équipement de sécurité doit être porté avant de quitter le véhicule ?","a":"Le gilet de haute visibilité (le terme « gilet jaune » est accepté)."},{"id":"s9","cat":"sec","q":"Pourquoi l'alerte auprès des services de secours doit-elle être rapide et précise ?","a":"Pour permettre aux secours d'apporter les moyens adaptés aux victimes dans le délai le plus court."},{"id":"s10","cat":"sec","q":"Quels sont les numéros d'urgence à composer ?","a":"Le 18 (sapeurs-pompiers), le 15 (SAMU) et le 112 (numéro d'urgence valable dans toute l'Union européenne)."},{"id":"s11","cat":"sec","q":"Quels comportements adopter en présence d'une victime qui ne répond pas et ne réagit pas, mais respire ?","a":"La placer en position stable sur le côté (PLS), alerter les secours, surveiller sa respiration jusqu'à leur arrivée."},{"id":"s12","cat":"sec","q":"Comment arrêter une hémorragie ?","a":"Appuyer fortement sur l'endroit qui saigne, avec les doigts ou la paume de la main, en mettant un tissu propre sur la plaie."},{"id":"s13","cat":"sec","q":"Hors autoroute ou endroit dangereux, en cas de panne ou d'accident, où doit être placé le triangle de pré-signalisation ?","a":"À environ 30 m de la panne ou de l'accident, ou avant un virage ou un sommet de côte."},{"id":"s14","cat":"sec","q":"Quelles sont les conditions pour réaliser le dégagement d'urgence d'une victime en présence d'un danger réel, immédiat et non contrôlable ?","a":"La victime doit être visible, facile à atteindre, rien ne doit gêner son dégagement, et il faut être sûr de pouvoir la dégager."},{"id":"s15","cat":"sec","q":"Quelles sont les trois informations à transmettre aux services de secours ?","a":"Le numéro de téléphone d'où l'on appelle, la nature du problème et sa localisation la plus précise."},{"id":"s16","cat":"sec","q":"Par quels moyens doit être réalisée l'alerte des secours ?","a":"Avec un téléphone portable ou, à défaut, un téléphone fixe ou une borne d'appel d'urgence."},{"id":"s17","cat":"sec","q":"Quel comportement doit-on adopter en présence d'une victime en arrêt cardiaque ?","a":"ALERTER immédiatement les secours, MASSER (réanimation cardio-pulmonaire), DÉFIBRILLER avec un DAE si possible."},{"id":"s18","cat":"sec","q":"Dans quel cas peut-on positionner une victime en Position Latérale de Sécurité (PLS) ?","a":"Si la victime ne répond pas, ne réagit pas et respire."},{"id":"s19","cat":"sec","q":"Dans quelle situation peut-on déplacer une victime ?","a":"En présence d'un danger réel, immédiat et non contrôlable. Ce déplacement doit rester exceptionnel."},{"id":"s20","cat":"sec","q":"Quel est l'objectif du SAIP (Système d'Alerte et d'Information des Populations) ?","a":"Avertir la population d'un danger imminent ou d'un événement grave en train de se produire."},{"id":"s21","cat":"sec","q":"Comment est diffusée l'alerte émise par le SAIP ?","a":"Grâce aux sirènes, aux médias tels que Radio France et France Télévisions, ou à l'application SAIP."},{"id":"s22","cat":"sec","q":"À partir de quel âge peut-on suivre une formation aux premiers secours ?","a":"À partir de 10 ans."},{"id":"s23","cat":"sec","q":"Pourquoi faut-il pratiquer immédiatement une réanimation cardio-pulmonaire sur une victime en arrêt cardiaque ?","a":"Car les lésions du cerveau surviennent dès les premières minutes."},{"id":"s24","cat":"sec","q":"Lors d'un appel aux secours, pourquoi devez-vous attendre que votre correspondant vous autorise à raccrocher ?","a":"Car il peut vous conseiller ou vous guider dans les gestes à faire, ou à ne pas faire, jusqu'à l'arrivée des secours."},{"id":"s25","cat":"sec","q":"À quel moment pouvez-vous mettre fin à un appel avec les secours ?","a":"Uniquement lorsque votre correspondant vous invite à le faire."},{"id":"s26","cat":"sec","q":"Citez les trois manières d'évaluer l'état de conscience d'une victime.","a":"Lui poser des questions simples (« comment ça va ? », « vous m'entendez ? »), lui secouer doucement les épaules, lui prendre la main en lui demandant un geste simple (« serrez-moi la main »)."},{"id":"s27","cat":"sec","q":"Quels sont les risques pour une personne en perte de connaissance allongée sur le dos ?","a":"L'arrêt respiratoire et l'arrêt cardiaque."},{"id":"s28","cat":"sec","q":"Pourquoi ne faut-il pas laisser une personne en perte de connaissance allongée sur le dos ?","a":"Elle risque l'étouffement, par des liquides présents dans la gorge ou par la chute de la langue en arrière."},{"id":"s29","cat":"sec","q":"L'utilisation d'un DAE sur une victime qui n'est pas en arrêt cardiaque présente-t-elle un risque ?","a":"Non, car le défibrillateur ne se déclenche que si la victime est en arrêt cardiaque."},{"id":"s30","cat":"sec","q":"Qu'est-ce qu'une hémorragie ?","a":"Une perte de sang prolongée qui ne s'arrête pas : elle imbibe un mouchoir en quelques secondes."},{"id":"s31","cat":"sec","q":"Quels sont les risques pour une personne victime d'une hémorragie ?","a":"Une détresse circulatoire ou un arrêt cardiaque."},{"id":"s32","cat":"sec","q":"Quels sont les signes d'un arrêt cardiaque ?","a":"La victime ne répond pas, ne réagit pas et ne respire pas, ou présente une respiration anormale."},{"id":"s33","cat":"sec","q":"Qu'est-ce qu'un défibrillateur automatisé externe (DAE) ?","a":"Un appareil qui peut rétablir une activité cardiaque normale chez une victime en arrêt cardiaque."},{"id":"s34","cat":"sec","q":"Qu'est-ce qu'un arrêt cardiaque ?","a":"Le cœur ne fonctionne plus ou fonctionne de façon anarchique."},{"id":"s35","cat":"sec","q":"Quel est le risque principal d'un arrêt cardiaque sans intervention des secours ?","a":"La mort de la victime, qui survient en quelques minutes."}],"fiches":[["i1","q1","s1"],["e1","q2","s2"],["i2","q3","s3"],["e2","q4","s4"],["i3","q5","s5"],["e3","q6","s6"],["i4","q7","s7"],["e4","q8","s8"],["i5","q9","s9"],["e5","q10","s10"],["i6","q11","s11"],["e6","q12","s12"],["i7","q13","s13"],["e7","q14","s14"],["i8","q15","s15"],["e8","q16","s16"],["i9","q17","s17"],["e9","q18","s18"],["i10","q19","s19"],["e10","q20","s8"],["i11","q21","s20"],["e11","q22","s21"],["i12","q23","s22"],["e12","q24","s23"],["i13","q25 function fresh(){
  return {v:1, name:'', examDate:'', target:85, hidden:[], levels:{}, notes:{}, pins:{}, updated:{}, history:[], journal:[], ql:{}, jj:{done:{},a:'',b:'',c:''}, lastBackup:'', since:'', remindAfter:''};
}
function normalize(o){
  var b=fresh();
  if(!o||typeof o!=='object') return b;
  b.name = typeof o.name==='string' ? o.name.slice(0,40) : '';
  b.examDate = /^\d{4}-\d{2}-\d{2}$/.test(o.examDate||'') ? o.examDate : '';
  var t=+o.target; b.target = (t>=50&&t<=100) ? Math.round(t/5)*5 : 85;
  b.hidden = Array.isArray(o.hidden) ? o.hidden.filter(function(m){ return MOMENTS.indexOf(m)>=0; }) : [];
  ['levels','notes','pins','updated'].forEach(function(k){
    var src=o[k]; if(!src||typeof src!=='object') return;
    Object.keys(src).forEach(function(id){
      var n=+id; if(!(n>=1&&n<=ITEMS.length)) return;
      var v=src[id];
      if(k==='levels'){ if(v===0||v===1||v===2) b.levels[n]=v; }
      else if(k==='notes'){ if(typeof v==='string'&&v) b.notes[n]=v.slice(0,600); }
      else if(k==='pins'){ if(v) b.pins[n]=true; }
      else if(typeof v==='string') b.updated[n]=v;
    });
  });
  if(o.ql&&typeof o.ql==='object'){ Object.keys(o.ql).forEach(function(k){ var v=o.ql[k]; if(QMAP[k]&&(v===0||v===1||v===2)) b.ql[k]=v; }); }
  var dre=/^\d{4}-\d{2}-\d{2}$/;
  ['lastBackup','since','remindAfter'].forEach(function(k){ if(typeof o[k]==='string'&&dre.test(o[k])) b[k]=o[k]; });
  if(o.jj&&typeof o.jj==='object'){
    if(o.jj.done&&typeof o.jj.done==='object') Object.keys(o.jj.done).forEach(function(k){ if(/^[vm]\d+$/.test(k)&&o.jj.done[k]) b.jj.done[k]=true; });
    ['a','b','c'].forEach(function(k){ if(typeof o.jj[k]==='string') b.jj[k]=o.jj[k].slice(0,300); });
  }
  b.history = Array.isArray(o.history) ? o.history.filter(function(h){ return h&&typeof h.d==='string'&&typeof h.p==='number'; }).map(function(h){ return {d:h.d,p:Math.max(0,Math.min(100,h.p))}; }).sort(function(a,c){ return a.d<c.d?-1:a.d>c.d?1:0; }).slice(-400) : [];
  b.journal = Array.isArray(o.journal) ? o.journal.filter(function(j){ return j&&typeof j.d==='string'; }).map(function(j){
    return {id:+j.id||Date.now(), d:j.d, dur:Math.max(0,+j.dur||0), feel:(+j.feel>=1&&+j.feel<=5)?+j.feel:0, good:String(j.good||'').slice(0,800), work:String(j.work||'').slice(0,800)};
  }).slice(-300) : [];
  return b;
}
var mem=null;
function load(){
  try{ var raw=localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){}
  return mem ? normalize(mem) : fresh();
}
var S = load();
function hasData(){ return Object.keys(S.updated).length>0||Object.keys(S.ql).length>0||S.journal.length>0; }
function persist(){
  if(!S.since&&hasData()) S.since=today();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ mem=JSON.parse(JSON.stringify(S)); }
}

/* ---------- Calculs ---------- */
function active(){ return ITEMS.filter(function(i){ return S.hidden.indexOf(i.moment)<0; }); }
function stats(list){
  var c=[0,0,0,0];
  list.forEach(function(i){ var l=S.levels[i.id]; c[l===undefined?3:l]++; });
  var n=list.length;
  return {c:c, n:n, pct:n?(c[1]+2*c[2])/(2*n)*100:0};
}
function momentStat(m){
  var l=ITEMS.filter(function(i){ return i.moment===m; });
  var s=stats(l);
  s.touched=l.some(function(i){ return S.updated[i.id]!==undefined; });
  return s;
}
function snapshot(){
  var st=stats(active()), d=today(), e={d:d, p:Math.round(st.pct*10)/10}, h=S.history;
  if(h.length&&h[h.length-1].d===d) h[h.length-1]=e; else h.push(e);
  if(h.length>400) h.splice(0,h.length-400);
}
function setLevel(id,k){
  if(S.levels[id]===k){ delete S.levels[id]; delete S.updated[id]; }
  else { S.levels[id]=k; S.updated[id]=today(); }
  snapshot(); persist();
}

function gauge(pct,target){
  var cx=160, cy=160, r=120, A0=150, SW=240;
  function pt(a,rad){ var t=a*Math.PI/180; return [cx+rad*Math.cos(t), cy+rad*Math.sin(t)]; }
  function arc(p1,p2,rad){
    var a1=A0+SW*p1/100, a2=A0+SW*p2/100, s=pt(a1,rad), e=pt(a2,rad);
    return 'M'+s[0].toFixed(2)+' '+s[1].toFixed(2)+' A'+rad+' '+rad+' 0 '+((a2-a1)>180?1:0)+' 1 '+e[0].toFixed(2)+' '+e[1].toFixed(2);
  }
  var b1=Math.max(0,Math.min(50,target-10));
  var zones=[[0,b1,'z0'],[b1,target,'z1'],[target,100,'z2']].filter(function(z){ return z[1]>z[0]; });
  var out='<svg viewBox="0 0 320 262" role="img" aria-label="Maîtrise globale : '+Math.round(pct)+' pour cent, objectif '+target+' pour cent">';
  zones.forEach(function(z){ out+='<path class="g-zone '+z[2]+'" d="'+arc(z[0]+(z[0]>0?0.6:0),z[1]-(z[1]<100?0.6:0),r)+'"/>'; });
  for(var v=0; v<=100; v+=10){
    var a=A0+SW*v/100, p1=pt(a,133), p2=pt(a,v%50===0?146:141);
    out+='<line class="g-tick" x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'"/>';
  }
  var l0=pt(A0,158), l1=pt(A0+SW,158);
  out+='<text class="g-lab" x="'+(l0[0]-2).toFixed(1)+'" y="'+(l0[1]+8).toFixed(1)+'" text-anchor="middle">0</text>';
  out+='<text class="g-lab" x="'+(l1[0]+2).toFixed(1)+'" y="'+(l1[1]+8).toFixed(1)+'" text-anchor="middle">100</text>';
  var ta=A0+SW*target/100, t1=pt(ta,104), t2=pt(ta,138);
  out+='<line class="g-target" x1="'+t1[0].toFixed(1)+'" y1="'+t1[1].toFixed(1)+'" x2="'+t2[0].toFixed(1)+'" y2="'+t2[1].toFixed(1)+'"/>';
  var tip=pt(A0,100);
  out+='<g class="needle" data-deg="'+(pct*SW/100).toFixed(1)+'" style="transform:rotate(0deg)"><line x1="160" y1="160" x2="'+tip[0].toFixed(1)+'" y2="'+tip[1].toFixed(1)+'"/></g>';
  out+='<circle class="g-hub" cx="160" cy="160" r="11"/><circle class="g-hub2" cx="160" cy="160" r="4.5"/>';
  out+='<text class="g-num" x="152" y="238" text-anchor="middle">'+Math.round(pct)+'</text><text class="g-pc" x="'+(152+String(Math.round(pct)).length*15+6)+'" y="238">%</text>';
  return out+'</svg>';
}

function saveFile(name,data){
  if(!DL){ toast("Le téléchargement n'est pas disponible ici. Utilise la copie manuelle."); return; }
  DL.save({filename:name,data:data}).then(function(){ toast('Fichier enregistré.'); }).catch(function(e){
    if(e&&e.code==='declined') return;
    toast("Le téléchargement a échoué. Essaie la copie manuelle.");
  });
}
function copyText(text){
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;opacity:0;top:0';
    document.body.appendChild(ta); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); toast(ok?'Copié dans le presse-papiers.':'Copie impossible : sélectionne le texte à la main.');
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ toast('Copié dans le presse-papiers.'); }).catch(fallback); }
  else fallback();
}
function goto(v){ view=v; render(); window.scrollTo(0,0); }
function render(){
  $$('.nav [data-view]').forEach(function(b){ b.setAttribute('aria-current', b.dataset.view===view?'page':'false'); });
  $$('.gear').forEach(function(b){ b.setAttribute('aria-current', view==='set'?'page':'false'); });
  ({dash:vDash,list:vList,exam:vExam,plan:vPlan,prog:vProg,set:vSet,help:vHelp,legal:vLegal,jj:vJJ})[view]();
  applyDl();
}

/* ---------- Vue : Bilan ---------- */
function examLine(){
  if(!S.examDate) return '<button type="button" class="link" data-action="nav" data-view="set">Ajouter la date de mon examen</button>';
  var d=Math.round((new Date(S.examDate+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
  var ds=fmtDate(S.examDate,true);
  var jl=' <button type="button" class="link" data-action="nav" data-view="jj">Préparer le jour J</button>';
  if(d>14) return 'Examen le '+ds+', dans '+d+' jours.';
  if(d>1) return 'Examen le '+ds+', dans '+d+' jours.'+jl;
  if(d===1) return 'Examen demain, le '+ds+'.'+jl;
  if(d===0) return "Examen aujourd'hui. Observe, analyse, agis."+jl;
  return 'Examen passé le '+ds+'.';
}
function domainsPanel(list){
  var m={};
  list.forEach(function(i){ (m[i.domain]=m[i.domain]||[]).push(i); });
  var rows=Object.keys(m).map(function(d){ var s=stats(m[d]); return {d:d,n:s.n,c:s.c,pct:s.pct}; })
    .filter(function(r){ return r.n>=2 && r.c[3]<r.n && r.pct<S.target; })
    .sort(function(a,b){ return a.pct-b.pct||b.n-a.n; }).slice(0,3);
  if(!rows.length) return '';
  return '<section class="panel"><h2>Domaines à surveiller</h2><p class="hint">Les gestes d\'une même famille, tous moments confondus.</p>'+
    rows.map(function(r){
      return '<div class="dom-row"><div>'+esc(r.d)+'<br><small>'+r.n+' réflexes</small></div>'+miniBar({c:r.c,n:r.n})+'<span class="pct">'+Math.round(r.pct)+' %</span></div>';
    }).join('')+'</section>';
}
function vDash(){
  var list=active(), st=stats(list), touched=Object.keys(S.updated).length>0;
  var p=Math.round(st.pct), t=S.target, h1, sub, cta;
  var need=Math.max(0,Math.ceil((t/100*2*st.n-(st.c[1]+2*st.c[2]))/2));
  var lead=S.name?esc(S.name)+', ta':'Ta';
  if(!touched){
    h1="Fais le point sur tes réflexes avant l'examen.";
    sub=st.n+' réflexes couvrent tout le parcours, du réglage du siège à la gestion du stress. Note chacun honnêtement : tu verras vite ce qui est solide et ce qui reste à travailler.';
    cta='<button type="button" class="btn" data-action="nav" data-view="list">Commencer mon évaluation</button><button type="button" class="btn ghost" data-action="demo">Voir un exemple rempli</button><button type="button" class="link" data-action="nav" data-view="help">Comment ça marche ?</button>';
  } else if(st.pct>=t){
    h1="Objectif atteint : tes réflexes sont solides.";
    sub=lead+' maîtrise globale est de '+p+' % pour un objectif de '+t+' %. Continue de les entretenir jusqu\'à l\'examen, surtout ceux encore « en progrès ».';
    cta='<button type="button" class="btn" data-action="nav" data-view="plan">Préparer ma prochaine leçon</button><button type="button" class="btn ghost" data-action="nav" data-view="list">Ouvrir ma checklist</button>';
  } else {
    h1='Il te reste environ '+need+' '+plural(need,'réflexe','réflexes')+' à automatiser.';
    sub=lead+' maîtrise globale est de '+p+' % pour un objectif de '+t+' %.'+(st.c[3]?' '+st.c[3]+' '+plural(st.c[3],'réflexe n\'est','réflexes ne sont')+' pas encore évalué'+(st.c[3]>1?'s':'')+'.':'');
    cta='<button type="button" class="btn" data-action="nav" data-view="plan">Préparer ma prochaine leçon</button><button type="button" class="btn ghost" data-action="nav" data-view="list">Continuer ma checklist</button>';
  }
  var focus=list.filter(function(i){ return S.pins[i.id]&&S.levels[i.id]!==2; }), sugg=false;
  if(!focus.length){ focus=list.filter(function(i){ return S.levels[i.id]===0; }).slice(0,5); sugg=true; }
  else focus=focus.slice(0,6);
  var lesson;
  if(focus.length){
    lesson='<p class="hint">'+(sugg?'Suggestion : tes premiers points à travailler. Épingle ceux que tu veux voir avec ton moniteur.':'Les réflexes que tu as épinglés.')+'</p><ul class="lesson">'+
      focus.map(function(i){ return '<li><small>'+esc(i.moment)+', '+esc(i.domain)+'</small>'+esc(i.text)+'</li>'; }).join('')+'</ul>';
  } else {
    lesson='<p class="hint">'+(touched?'Aucun point à travailler pour le moment.':'Évalue quelques réflexes : tes priorités apparaîtront ici.')+'</p>';
  }
  var route=MOMENTS.filter(function(m){ return S.hidden.indexOf(m)<0; }).map(function(m){
    var s=momentStat(m), col='';
    if(s.touched) col=s.pct>=t?'var(--c2)':(s.pct>=50?'var(--c1)':'var(--c0)');
    return '<li><button type="button" class="stop" data-action="goto-moment" data-moment="'+esc(m)+'" aria-label="'+esc(m)+' : '+s.c[2]+' sur '+s.n+' automatisés, ouvrir dans la checklist">'+
      '<span class="node'+(s.touched?' on':'')+'"'+(col?' style="--nc:'+col+'"':'')+'></span><span>'+esc(m)+'</span>'+miniBar(s)+'<span class="stop-n">'+s.c[2]+'/'+s.n+'</span></button></li>';
  }).join('');
  app.innerHTML=
    backupBanner()+'<section class="hero"><div class="cluster">'+gauge(st.pct,t)+'<p class="g-cap"><i class="g-key"></i>Objectif '+t+' %</p></div>'+
    '<div class="hero-txt"><h1>'+h1+'</h1><p class="lede">'+sub+'</p>'+
    (touched?stackBar(st.c)+legendHTML(st.c,true):defsHTML())+
    '<div class="cta-row">'+cta+'</div><p class="exam" style="margin-top:14px">'+examLine()+'</p></div></section>'+
    '<div class="cols"><section class="panel"><h2>Ton parcours</h2><p class="hint">Un arrêt par moment de l\'examen. Clique sur un arrêt pour voir le détail.</p><ul class="route">'+route+'</ul></section>'+
    '<div class="col"><section class="panel"><h2>À travailler à la prochaine leçon</h2>'+lesson+
    '<button type="button" class="btn ghost small" data-action="nav" data-view="plan">Ouvrir le plan de travail</button></section>'+qDashPanel()+(touched?domainsPanel(list):'')+'</div></div>';
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    var n=$('.needle'); if(n) n.style.transform='rotate('+n.getAttribute('data-deg')+'deg)';
  }); });
}

/* ---------- Vue : Checklist ---------- */
function matches(i){
  var l=S.levels[i.id];
  if(F.status!=='all'){
    if(F.status==='n'){ if(l!==undefined) return false; }
    else if(l!==+F.status) return false;
  }
  if(F.moment!=='all'&&i.moment!==F.moment) return false;
  if(F.pin&&!S.pins[i.id]) return false;
  if(F.q&&norm(i.text+' '+i.domain+' '+i.moment).indexOf(norm(F.q))<0) return false;
  return true;
}
function renderList(){
  var its=active().filter(matches), el=$('#list');
  if(!its.length){
    el.innerHTML='<div class="empty"><p>Aucun réflexe ne correspond à ces filtres.</p><button type="button" class="btn ghost small" data-action="reset-filters">Effacer les filtres</button></div>';
    return;
  }
  var by={}; its.forEach(function(i){ (by[i.moment]=by[i.moment]||[]).push(i); });
  el.innerHTML=MOMENTS.filter(function(m){ return by[m]; }).map(function(m){ return grpHTML(m,by[m]); }).join('');
}
function chipsHTML(){
  var defs=[['all','Tous'],['n','Non évalués'],['0','À travailler'],['1','En progrès'],['2','Automatisés']];
  return defs.map(function(d){ return '<button type="button" class="chip" data-action="status" data-status="'+d[0]+'" aria-pressed="'+(F.status===d[0])+'">'+d[1]+'</button>'; }).join('')+
    '<button type="button" class="chip" data-action="pinfilter" aria-pressed="'+F.pin+'">Épinglés</button>';
}
function vList(){
  var opts='<option value="all">Tous les moments</option>'+MOMENTS.filter(function(m){ return S.hidden.indexOf(m)<0; }).map(function(m){ return '<option value="'+esc(m)+'"'+(F.moment===m?' selected':'')+'>'+esc(m)+'</option>'; }).join('');
  app.innerHTML=
    '<div class="page-head"><h1>Ma checklist</h1><p class="lede">Pour chaque réflexe, choisis le niveau qui te ressemble aujourd\'hui. Reclique sur le niveau choisi pour l\'effacer.</p>'+defsHTML()+'</div>'+
    '<div class="sumbar" id="sum">'+sumHTML()+'</div>'+
    '<div class="filters"><div class="field"><label for="q">Rechercher</label><input class="inp" id="q" type="search" value="'+esc(F.q)+'" placeholder="Ex. : angle mort, giratoire…" autocomplete="off"></div>'+
    '<div class="field"><label for="f-moment">Moment</label><select class="inp" id="f-moment">'+opts+'</select></div></div>'+
    '<div class="chips" id="chips" style="margin-top:12px">'+chipsHTML()+'</div><div id="list"></div>';
  renderList();
}
function refreshRow(id){
  $$('.row[data-id="'+id+'"]').forEach(function(li){
    var l=S.levels[id]; li.setAttribute('data-l', l===undefined?'n':l);
    $$('.lv',li).forEach(function(b){ b.setAttribute('aria-pressed', String(+b.dataset.k===l)); });
  });
  $$('.grp[data-moment]').forEach(function(g){ $('.grp-stat',g).innerHTML=momentStatHTML(g.dataset.moment); });
  var sum=$('#sum'); if(sum) sum.innerHTML=sumHTML();
}

/* ---------- Vue : Plan de travail ---------- */
function todoList(){ return active().filter(function(i){ var l=S.levels[i.id]; return l===0||l===1; }); }
function ficheText(){
  var todo=todoList(), pin=todo.filter(function(i){ return S.pins[i.id]; }), rest=todo.filter(function(i){ return !S.pins[i.id]; });
  function line(i){ return '[ ] '+i.moment+' / '+i.domain+' : '+i.text+(S.levels[i.id]===1?' (en progrès)':'')+(S.notes[i.id]?'\n      Note : '+S.notes[i.id]:''); }
  var out=['CAP PERMIS B - FICHE DE LEÇON','Date : '+fmtDate(today(),true)+(S.name?'  |  '+S.name:''),''];
  out.push('À AVOIR EN TÊTE PENDANT LA LEÇON ('+pin.length+')');
  out=out.concat(pin.length?pin.map(line):['(aucun réflexe épinglé)']);
  out.push('','RESTE À AUTOMATISER ('+rest.length+')');
  MOMENTS.forEach(function(m){ var a=rest.filter(function(i){ return i.moment===m; }); if(a.length){ out.push('',m.toUpperCase()); a.forEach(function(i){ out.push(line(i)); }); } });
  return out.join('\n');
}

  var todo=todoList(), unk=active().filter(function(i){ return S.levels[i.id]===undefined; }).length;
  var pin=todo.filter(function(i){ return S.pins[i.id]; }), rest=todo.filter(function(i){ return !S.pins[i.id]; });
  var by={}; rest.forEach(function(i){ (by[i.moment]=by[i.moment]||[]).push(i); });
  var html='<div class="page-head"><h1>Plan de travail</h1><p class="lede">Prépare ta prochaine leçon : épingle 3 à 5 réflexes à travailler avec ton moniteur, puis garde la fiche avec toi.</p>'+

  if(unk){ html+='<div class="banner no-print"><span><b>'+unk+'</b> '+plural(unk,'réflexe n\'est','réflexes ne sont')+' pas encore '+plural(unk,'évalué','évalués')+'.</span><button type="button" class="btn ghost small" data-action="goto-status" data-status="n">Les évaluer</button></div>'; }
  if(!todo.length){
    html+='<div class="empty"><p>'+(unk===active().length?"Évalue d'abord quelques réflexes dans la checklist : ceux que tu classes « à travailler » ou « en progrès » arriveront ici.":"Rien à travailler : tous les réflexes évalués sont automatisés.")+'</p><button type="button" class="btn small" data-action="nav" data-view="list">Ouvrir la checklist</button></div>';

    html+='<section class="grp"><header class="grp-h"><h2>À aborder à la prochaine leçon</h2><div class="grp-stat"><span>'+pin.length+' épinglé'+(pin.length>1?'s':'')+'</span></div></header>'+
      (pin.length?'<ul class="rows">'+pin.map(rowHTML).join('')+'</ul>':'<p class="hint" style="padding:14px 0">Aucun réflexe épinglé. Utilise le drapeau sur un réflexe ci-dessous.</p>')+'</section>';
    html+='<h2 style="margin-top:38px;font-size:1.9rem">Reste à automatiser</h2>'+MOMENTS.filter(function(m){ return by[m]; }).map(function(m){ return grpHTML(m,by[m]); }).join('');
  }
  app.innerHTML=html;

/* ---------- Vue : Évolution ---------- */
function chartHTML(){
  var h=S.history;
  if(!h.length) return '<div class="empty"><p>Ta courbe démarre dès que tu évalues un premier réflexe.</p><button type="button" class="btn small" data-action="nav" data-view="list">Ouvrir la checklist</button></div>';
  var W=720,H=300,L=46,R=18,T=18,B=40, iw=W-L-R, ih=H-T-B;
  var ts=h.map(function(x){ return new Date(x.d+'T00:00:00').getTime(); }), t0=ts[0], t1=ts[ts.length-1];
  function X(i){ return ts.length===1?L+iw/2:L+(t1===t0?0:(ts[i]-t0)/(t1-t0))*iw; }
  function Y(v){ return T+ih-(v/100)*ih; }
  var o='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Courbe de maîtrise globale dans le temps">';
  [0,25,50,75,100].forEach(function(v){ o+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+' %</text>'; });
  o+='<line class="tg" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(S.target)+'" y2="'+Y(S.target)+'"/><text class="tgl" x="'+(W-R)+'" y="'+(Y(S.target)-6)+'" text-anchor="end">Objectif '+S.target+' %</text>';
  if(h.length>1){
    var pts=h.map(function(x,i){ return X(i).toFixed(1)+' '+Y(x.p).toFixed(1); });
    o+='<path class="ar" d="M'+X(0).toFixed(1)+' '+Y(0)+' L'+pts.join(' L')+' L'+X(h.length-1).toFixed(1)+' '+Y(0)+' Z"/><path class="ln" d="M'+pts.join(' L')+'"/>';
  }
  h.forEach(function(x,i){ o+='<circle class="pt" cx="'+X(i).toFixed(1)+'" cy="'+Y(x.p).toFixed(1)+'" r="5"><title>'+fmtDate(x.d,true)+' : '+Math.round(x.p)+' %</title></circle>'; });
  var idx=[]; if(h.length<=5){ h.forEach(function(_,i){ idx.push(i); }); } else { for(var k=0;k<5;k++){ var v=Math.round(k*(h.length-1)/4); if(idx.indexOf(v)<0) idx.push(v); } }
  idx.forEach(function(i){ o+='<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+fmtDate(h[i].d,false)+'</text>'; });
  return o+'</svg>';
}

      (h.length>1?'<div class="kpi"><b>'+(diff>0?'+':'')+diff+' pts</b><span>d\'évolution</span></div>':'')+'</div>';

  var rec=Object.keys(S.updated).map(function(id){ return {id:+id,d:S.updated[id],l:S.levels[id]}; })

    .sort(function(a,b){ return a.d<b.d?1:a.d>b.d?-1:a.id-b.id; }).slice(0,8);

  app.innerHTML=
    '<div class="page-head"><h1>Évolution</h1><p class="lede">Ta courbe se met à jour à chaque réflexe évalué. Note aussi tes séances pour garder la trace de ce qui bouge.</p></div>'+
    '<section class="panel" style="margin-top:18px"><h2>Maîtrise globale</h2>'+kpis+chartHTML()+'</section>'+
    '<div class="two"><section class="panel"><h2>Journal de conduite</h2><p class="hint">Après chaque leçon, quelques lignes suffisent.</p>'+
    '<div class="form-grid"><div class="field"><label for="j-date">Date</label><input class="inp" id="j-date" type="date" value="'+today()+'"></div>'+
    '<div class="field"><label for="j-dur">Durée en minutes</label><input class="inp" id="j-dur" type="number" min="0" max="600" step="5" placeholder="60"></div>'+
    '<div class="field wide"><span id="feel-l">Comment ça s\'est passé ?</span><div class="feel" role="group" aria-labelledby="feel-l">'+
      [1,2,3,4,5].map(function(n){ return '<button type="button" class="chip" aria-pressed="'+(J.feel===n)+'" data-action="feel" data-n="'+n+'">'+FEEL[n]+'</button>'; }).join('')+'</div></div>'+
    '<div class="field wide"><label for="j-good">Ce qui s\'est bien passé</label><textarea class="inp" id="j-good" rows="2" maxlength="800"></textarea></div>'+
    '<div class="field wide"><label for="j-work">À retravailler</label><textarea class="inp" id="j-work" rows="2" maxlength="800"></textarea></div>'+
    '<div class="wide"><button type="button" class="btn" data-action="jadd">Ajouter la séance</button></div></div>'+
    '<div style="margin-top:22px">'+(journal.length?journal.map(function(j){
      return '<article class="entry"><div class="entry-h"><b>'+fmtDate(j.d,true)+'</b>'+(j.dur?'<span class="muted">'+j.dur+' min</span>':'')+(j.feel?'<span class="tag">'+FEEL[j.feel]+'</span>':'')+
        '<button type="button" class="btn ghost small" data-action="jdel" data-id="'+j.id+'">Supprimer</button></div>'+
        (j.good?'<p><span>Bien passé :</span> '+esc(j.good)+'</p>':'')+(j.work?'<p><span>À retravailler :</span> '+esc(j.work)+'</p>':'')+'</article>';
    }).join(''):'<p class="hint">Aucune séance notée pour l\'instant.</p>')+'</div></section>'+
    '<section class="panel"><h2>Derniers réflexes évalués</h2>'+recent+'</section></div>';
}


/* ---------- Vue : Questions de l'examen ---------- */
function qstats(list){
  var c=[0,0,0,0];
  list.forEach(function(i){ var l=S.ql[i.id]; c[l===undefined?3:l]++; });
  var n=list.length;
  return {c:c, n:n, pct:n?(c[1]+2*c[2])/(2*n)*100:0};
}
function qLegendHTML(c){
  var d=[[2,c[2],plural(c[2],'maîtrisée','maîtrisées')],[1,c[1],plural(c[1],'presque sûre','presque sûres')],[0,c[0],'à revoir'],['n',c[3],plural(c[3],'pas encore vue','pas encore vues')]];
  return '<ul class="legend">'+d.map(function(x){ return '<li><span class="lg"><i class="sw s'+x[0]+'"></i><span><b>'+x[1]+'</b> '+x[2]+'</span></span></li>'; }).join('')+'</ul>';
}
function qSumHTML(){
  var st=qstats(QITEMS);
  var cats=['int','ext','qser','sec'].map(function(k){
    var s=qstats(QITEMS.filter(function(i){ return i.cat===k; }));
    return '<div class="qcat"><b>'+QCATS[k].name+'</b>'+miniBar(s)+'<small>'+s.c[2]+' sur '+s.n+' maîtrisées</small></div>';
  }).join('');
  return '<h2>Ta progression sur les questions</h2><div class="sum-line" style="margin-top:8px"><span class="big">'+st.c[2]+'</span><span class="t">questions maîtrisées sur '+st.n+' questions différentes</span></div>'+stackBar(st.c,QLAB)+qLegendHTML(st.c)+'<div class="qcats">'+cats+'</div>';
}
function refreshQSum(){ var el=$('#qsum'); if(el) el.innerHTML=qSumHTML(); }
function qDashPanel(){
  var st=qstats(QITEMS);
  return '<section class="panel"><h2>Questions de l\'examen</h2><p class="hint">Vérification intérieure et extérieure, sécurité routière, premiers secours : les 100 fiches à connaître.</p>'+
    '<div style="margin-top:12px">'+stackBar(st.c,QLAB)+'</div>'+qLegendHTML(st.c)+
