    '<p class="hint">Évalue tes réflexes dans la checklist : tes points forts apparaîtront ici. Les relire avant l\'examen fait du bien.</p>';
  app.innerHTML=
    '<div class="page-head"><h1>Jour J</h1><p class="lede">De quoi arriver serein à l\'examen : la préparation de la veille et du matin, les bons réflexes pendant l\'épreuve, puis quelques exercices pour te mettre en confiance.</p></div>'+
    jjHero()+
    '<section class="jj-sec"><div class="jj-h"><h2>La veille</h2><span class="muted" data-jjcount="veille">'+jjCount('veille')+'</span></div>'+jjList('veille')+'</section>'+
    '<section class="jj-sec"><div class="jj-h"><h2>Le matin</h2><span class="muted" data-jjcount="matin">'+jjCount('matin')+'</span></div>'+jjList('matin')+
      '<div class="tools no-print"><button type="button" class="btn ghost small" data-action="jj-reset">Décocher les cases</button></div></section>'+
    '<section class="jj-sec"><h2>Pendant l\'épreuve</h2><p class="jj-note">Trois idées à garder en tête : <b>observer, analyser, agir</b> ; une erreur n\'est pas un échec ; prends ton temps. Si tu ne comprends pas une consigne, demande à l\'examinateur de la répéter.</p>'+
      (exam.length?grpHTML('Examen',exam):'')+'</section>'+
    '<section class="jj-sec"><h2>Exercices de confiance</h2>'+
      '<section class="panel" style="margin-top:16px"><h3 class="h3" style="margin-top:0">1. Respire pour te calmer</h3><p class="hint">Inspire 4 secondes par le nez, expire 6 secondes doucement. 6 cycles, environ une minute.</p>'+
      '<div class="br-stage"><div class="br-circle" id="br-circle"></div><div class="br-text"><strong id="br-phase" aria-live="polite">Prêt ?</strong><span id="br-count"></span></div></div>'+
      '<button type="button" class="btn" id="br-btn" data-action="br-toggle">Commencer</button>'+
      '<p class="hint" style="margin-top:10px">Simple exercice de détente. Si tu ne te sens pas bien, arrête-toi et respire normalement.</p></section>'+
      '<section class="panel" style="margin-top:16px"><h3 class="h3" style="margin-top:0">2. Rappelle-toi ce que tu sais faire</h3>'+strongHTML+'</section>'+
      '<section class="panel" style="margin-top:16px"><h3 class="h3" style="margin-top:0">3. Visualise ton examen (2 minutes)</h3><p class="hint">Lis ces étapes lentement, en imaginant chaque scène.</p><ol class="visu">'+
        '<li>Assieds-toi confortablement et fais deux respirations lentes.</li>'+
        "<li>Imagine-toi arriver à la voiture. Tu règles le siège et les rétroviseurs, tu attaches ta ceinture, tranquillement.</li>"+
        "<li>Tu démarres. Tu regardes loin, tu contrôles autour de toi, tu roules à une allure bien adaptée.</li>"+
        "<li>Un carrefour approche. Tu te demandes : « qu'est-ce que je ne vois pas ? » Tu ralentis à temps.</li>"+
        "<li>Tu fais une petite erreur. Tu respires, tu te dis « ce n'est pas grave » et tu continues normalement.</li>"+
        "<li>Tu te gares, l'examinateur te remercie. Tu ressens le calme et la fierté d'avoir fait de ton mieux.</li></ol></section>"+
      '<section class="panel" style="margin-top:16px"><h3 class="h3" style="margin-top:0">4. Ma carte de confiance</h3><p class="hint">Écris tes propres mots. Ils restent sur cet appareil.</p>'+
        '<div class="form-grid" style="margin-top:12px"><div class="field wide"><label for="jj-a">Ma phrase pour le jour J</label><input class="inp" id="jj-a" data-in="jj" data-k="a" maxlength="300" value="'+esc(S.jj.a)+'" placeholder="Ex. : je respire, j\'observe, j\'agis."></div>'+
        '<div class="field wide"><label for="jj-b">Ce que je me dis si je fais une erreur</label><input class="inp" id="jj-b" data-in="jj" data-k="b" maxlength="300" value="'+esc(S.jj.b)+'" placeholder="Ex. : ce n\'est pas grave, je continue."></div>'+
        '<div class="field wide"><label for="jj-c">Ce dont je suis fier(e) dans mon apprentissage</label><textarea class="inp" id="jj-c" data-in="jj" data-k="c" rows="2" maxlength="300">'+esc(S.jj.c)+'</textarea></div></div>'+
        '<p class="hint" style="margin-top:16px">Une phrase pour toi :</p><p class="phrase" id="phrase">'+esc(S.jj.a||PHRASES[0])+'</p>'+
        '<button type="button" class="btn ghost small" data-action="jj-phrase">Une autre phrase</button></section>'+
    '</section>';
}
function brStop(text){
  clearInterval(BR.t); BR.t=null; BR.run=false;
  var b=$('#br-btn'), ph=$('#br-phase'), c=$('#br-count'), ci=$('#br-circle');
  if(b) b.textContent='Commencer';
  if(ph) ph.textContent=text||'Prêt ?';
  if(c) c.textContent='';
  if(ci){ ci.style.transitionDuration='1s'; ci.style.transform='scale(.6)'; }
}
function brStart(){
  var seq=[]; for(var k=0;k<6;k++){ seq.push(['Inspire',4]); seq.push(['Expire',6]); }
  var idx=0, left=0; BR.run=true; $('#br-btn').textContent='Arrêter';
  function begin(){
    var ph=seq[idx]; left=ph[1];
    $('#br-phase').textContent=ph[0]; $('#br-count').textContent=left;
    var ci=$('#br-circle'); ci.style.transitionDuration=ph[1]+'s'; ci.style.transform=ph[0]==='Inspire'?'scale(1)':'scale(.6)';
  }
  begin();
  BR.t=setInterval(function(){
    if(view!=='jj'||!$('#br-circle')){ clearInterval(BR.t); BR.run=false; return; }
    left--;
    if(left<=0){ idx++; if(idx>=seq.length){ brStop('Bravo. Respire normalement.'); return; } begin(); }
    else $('#br-count').textContent=left;
  },1000);
}

/* ---------- Vue : Réglages ---------- */
function vSet(){
  var mods=MOMENTS.map(function(m){
    var n=ITEMS.filter(function(i){ return i.moment===m; }).length;
    return '<label class="check"><input type="checkbox" data-ch="module" value="'+esc(m)+'"'+(S.hidden.indexOf(m)<0?' checked':'')+'><span>'+esc(m)+'</span><span class="muted">'+n+' réflexe'+(n>1?'s':'')+'</span></label>';
  }).join('');
  app.innerHTML=
    '<div class="page-head"><h1>Réglages</h1></div><div class="stackv">'+
    '<section class="panel"><h2>Mon profil</h2><div class="form-grid" style="margin-top:12px">'+
      '<div class="field"><label for="s-name">Prénom (facultatif)</label><input class="inp" id="s-name" data-in="name" maxlength="40" value="'+esc(S.name)+'" autocomplete="given-name"></div>'+
      '<div class="field"><label for="s-exam">Date de l\'examen</label><input class="inp" id="s-exam" type="date" data-in="exam" value="'+esc(S.examDate)+'"></div>'+
      '<div class="field wide"><label for="s-target">Objectif de maîtrise</label><div class="range"><input id="s-target" type="range" min="50" max="100" step="5" data-in="target" value="'+S.target+'"><output id="s-target-o" for="s-target">'+S.target+' %</output></div>'+
      '<span class="hint">Le repère blanc sur la jauge. Vise 85 % ou plus avant de passer l\'examen.</span></div></div></section>'+
    '<section class="panel"><h2>Réflexes suivis</h2><p class="hint">Décoche ce qui ne concerne pas ton examen, par exemple la boîte manuelle si tu passes en boîte automatique. <span id="mod-count"></span></p>'+
      '<div class="tools" style="margin:10px 0 12px"><button type="button" class="btn ghost small" data-action="preset-auto">Je passe en boîte automatique</button><button type="button" class="btn ghost small" data-action="preset-all">Tout suivre</button></div>'+mods+'</section>'+
    '<section class="panel"><h2>Mes données</h2><p class="hint">Tout est enregistré dans ce navigateur. Certains navigateurs (comme Safari sur iPhone) peuvent effacer les données d\'un site qu\'on n\'a pas ouvert depuis longtemps. Sauvegarde ton suivi de temps en temps, et avant de changer d\'appareil.</p><p class="hint" id="bk-line" style="margin-top:8px"><b>'+bkLine()+'</b></p>'+
      '<div class="tools"><button type="button" class="btn" data-action="export-json" data-needs-dl hidden>Télécharger ma sauvegarde</button><button type="button" class="btn ghost" data-action="export-csv" data-needs-dl hidden>Exporter en tableau (CSV)</button><button type="button" class="btn ghost" data-action="pick-file">Restaurer depuis un fichier</button><input type="file" id="imp-file" accept=".json,application/json" hidden></div>'+
      '<h3 class="h3">Sauvegarde par copier-coller</h3><p class="hint">Copie ce texte dans un endroit sûr. Pour restaurer, colle-le dans la zone puis valide.</p>'+
      '<textarea class="inp" id="io" rows="4" style="margin-top:8px" spellcheck="false" placeholder="Ta sauvegarde apparaîtra ici"></textarea>'+
      '<div class="tools"><button type="button" class="btn ghost small" data-action="io-show">Afficher et copier ma sauvegarde</button><button type="button" class="btn ghost small" data-action="io-restore">Restaurer depuis ce texte</button></div>'+
      '<h3 class="h3">Zone sensible</h3><div class="tools"><button type="button" class="btn ghost small" data-action="demo">Charger un exemple rempli</button><button type="button" class="btn danger small" data-action="reset">Tout effacer</button></div>'+
      '<p class="hint" style="margin-top:8px">Charger l\'exemple ou tout effacer remplace ton suivi actuel.</p></section></div>';
  updModCount();
}
function updModCount(){ var el=$('#mod-count'); if(el) el.textContent=active().length+' réflexes suivis sur '+ITEMS.length+'.'; }

function toCSV(){
  function q(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
  var rows=[['n°','Moment','Domaine','Réflexe','Niveau','Épinglé','Note','Dernière mise à jour']];
  ITEMS.forEach(function(i){
    var l=S.levels[i.id];
    rows.push([i.id,i.moment,i.domain,i.text,l===undefined?'Non évalué':LV[l].name,S.pins[i.id]?'oui':'',S.notes[i.id]||'',S.updated[i.id]||'']);
  });
  return '\ufeff'+rows.map(function(r){ return r.map(q).join(';'); }).join('\r\n');
}
function loadExample(){
  var b=fresh(); b.name=S.name; b.examDate=S.examDate; b.target=S.target; b.ql=S.ql||{};
  ITEMS.forEach(function(i){ b.levels[i.id]=EXAMPLE_TODO.indexOf(i.id)>=0?0:2; b.updated[i.id]=today(); });
  b.notes[9]="Lever les yeux : viser le fond de la rue, pas le capot.";
  b.notes[72]="Lever le pied avant le carrefour, pas pendant.";
  [9,20,72].forEach(function(id){ b.pins[id]=true; });
  b.history=[[35,31],[28,46],[21,58],[14,69],[7,78]].map(function(x){ return {d:daysAgo(x[0]),p:x[1]}; });
  b.journal=[
    {id:1,d:daysAgo(9),dur:60,feel:3,good:"Insertion sur voie rapide bien préparée, rétros systématiques.",work:"Anticiper les intersections : je regarde encore trop près."},
    {id:2,d:daysAgo(2),dur:90,feel:4,good:"Créneau réussi du premier coup, giratoires fluides.",work:"Adapter ma vitesse avant la situation, pas pendant."}
  ];
  S=b; snapshot(); persist();
}
function armed(btn,label){
  if(btn.dataset.armed){ clearTimeout(btn._t); delete btn.dataset.armed; return true; }
  btn.dataset.armed='1'; btn.dataset.old=btn.textContent; btn.textContent=label||'Confirmer ?';
  btn._t=setTimeout(function(){ delete btn.dataset.armed; btn.textContent=btn.dataset.old; },3500);
  return false;
}
function importObj(txt){
  var o; try{ o=JSON.parse(txt); }catch(e){ toast("Ce texte n'est pas une sauvegarde valide."); return; }
  if(!o||typeof o!=='object'||!o.levels){ toast("Ce texte n'est pas une sauvegarde Cap Permis B."); return; }
  S=normalize(o); persist(); render(); toast('Sauvegarde restaurée.');
}

/* ---------- Événements ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-action]'); if(!t) return;
  var a=t.dataset.action, id=+t.dataset.id;
  switch(a){
    case 'nav': goto(t.dataset.view); break;
    case 'br-toggle': if(BR.run) brStop(); else brStart(); break;
    case 'jj-phrase': var pe=$('#phrase'), np; do{ np=PHRASES[Math.floor(Math.random()*PHRASES.length)]; }while(np===pe.textContent&&PHRASES.length>1); pe.textContent=np; break;
    case 'jj-reset': S.jj.done={}; persist(); $$('[data-ch="jjcheck"]').forEach(function(c){ c.checked=false; }); $$('[data-jjcount]').forEach(function(e){ e.textContent=jjCount(e.dataset.jjcount); }); break;

    case 'ex-tab': EX.tab=t.dataset.tab; renderExBody(); break;
    case 'ex-type': EX.type=t.dataset.type; $$('#ex-types [data-type]').forEach(function(c){ c.setAttribute('aria-pressed',String(c.dataset.type===EX.type)); }); renderFicheList(); break;
    case 'fiche-open':
      var raw=($('#fiche-n').value||'').trim(), num=/^\d+$/.test(raw)?parseInt(raw,10):NaN;
      if(!(num>=1&&num<=100)){ $('#fiche-err').textContent='Entre un nombre entier entre 1 et 100.'; $('#fiche-n').focus(); break; }
      openFiche(num,true); break;
    case 'fiche-random': openFiche(randomFiche(),true); break;
    case 'fiche-prev': openFiche(EX.fiche>1?EX.fiche-1:100,true); break;
    case 'fiche-next': openFiche(EX.fiche<100?EX.fiche+1:1,true); break;
    case 'fiche-go': EX.tab='fiche'; renderExBody(); openFiche(+t.dataset.n,true); break;
    case 'toggle-ans':
      EX.showAns=!EX.showAns;
      $$('#ex-body details.ans').forEach(function(d){ d.open=EX.showAns; });
      $$('[data-action="toggle-ans"]').forEach(function(b){ b.textContent=EX.showAns?'Masquer les réponses':'Afficher les réponses'; }); break;
    case 'qlevel':
      var qid=t.dataset.qid, qk=+t.dataset.k;
      if(S.ql[qid]===qk) delete S.ql[qid]; else S.ql[qid]=qk;
      persist();
      $$('.qcard[data-qid="'+qid+'"]').forEach(function(c){
        var l=S.ql[qid]; c.setAttribute('data-l',l===undefined?'n':l);
        $$('.lv',c).forEach(function(b){ b.setAttribute('aria-pressed',String(+b.dataset.k===l)); });
      });
      refreshQSum(); break;

    case 'theme':
      var dark=document.documentElement.getAttribute('data-theme')==='dark' || (!document.documentElement.getAttribute('data-theme') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      var next=dark?'light':'dark'; document.documentElement.setAttribute('data-theme',next);
      try{ localStorage.setItem(THEME_KEY,next); }catch(err){}
      break;
    case 'level': setLevel(id,+t.dataset.k); refreshRow(id); break;
    case 'pin':
      if(S.pins[id]) delete S.pins[id]; else S.pins[id]=true;
      persist(); t.setAttribute('aria-pressed',String(!!S.pins[id])); break;
    case 'note':
      var row=t.closest('.row'), box=$('.note',row), open=box.hidden;
      box.hidden=!open; openNotes[id]=open; t.setAttribute('aria-expanded',String(open));
      if(open) $('textarea',box).focus(); break;
    case 'status':
      F.status=t.dataset.status; $$('#chips [data-action="status"]').forEach(function(c){ c.setAttribute('aria-pressed',String(c.dataset.status===F.status)); }); renderList(); break;
    case 'pinfilter':
      F.pin=!F.pin; t.setAttribute('aria-pressed',String(F.pin)); renderList(); break;
    case 'reset-filters':
      F.q='';F.status='all';F.moment='all';F.pin=false; vList(); break;
    case 'goto-moment': F={q:'',status:'all',moment:t.dataset.moment,pin:false}; goto('list'); break;
    case 'goto-status': F={q:'',status:t.dataset.status,moment:'all',pin:false}; goto('list'); break;
    case 'demo':
      if(Object.keys(S.updated).length&&!armed(t,'Confirmer le remplacement ?')) break;
      loadExample(); view='dash'; render(); window.scrollTo(0,0); toast('Exemple chargé. Tu peux tout effacer dans les réglages.'); break;
    case 'reset':
      if(!armed(t,'Confirmer : tout effacer ?')) break;
      S=fresh(); persist(); F={q:'',status:'all',moment:'all',pin:false}; openNotes={}; render(); toast('Suivi effacé.'); break;
    case 'preset-auto':
      if(S.hidden.indexOf('Boîte manuelle')<0) S.hidden.push('Boîte manuelle');
      if(Object.keys(S.updated).length) snapshot(); persist(); vSet(); toast('Boîte manuelle retirée du suivi.'); break;
    case 'preset-all': S.hidden=[]; if(Object.keys(S.updated).length) snapshot(); persist(); vSet(); break;
    case 'fiche-copy': copyText(ficheText()); break;
    case 'fiche-dl': saveFile('cap-permis-fiche-lecon-'+today()+'.txt',ficheText()); break;
    case 'print': try{ window.print(); }catch(err){ toast("L'impression n'est pas disponible ici. Utilise « Copier la fiche »."); } break;
    case 'export-json': doBackup(); break;
    case 'backup-now': doBackup(); break;
    case 'backup-later': S.remindAfter=addDays(today(),3); persist(); render(); toast('Je te le rappellerai dans 3 jours.'); break;
    case 'export-csv': saveFile('cap-permis-suivi-'+today()+'.csv',toCSV()); break;
    case 'pick-file': $('#imp-file').click(); break;
    case 'io-show': markBackup(); var ta=$('#io'); ta.value=JSON.stringify(S); ta.focus(); ta.select(); copyText(ta.value); break;
    case 'io-restore': var v=$('#io').value.trim(); if(!v){ toast("Colle d'abord ta sauvegarde dans la zone."); break; } if(!armed(t,'Confirmer le remplacement ?')) break; importObj(v); break;
    case 'feel': J.feel=(J.feel===+t.dataset.n)?0:+t.dataset.n; $$('[data-action="feel"]').forEach(function(c){ c.setAttribute('aria-pressed',String(+c.dataset.n===J.feel)); }); break;
    case 'jadd':
      var d=$('#j-date').value||today(), dur=parseInt($('#j-dur').value,10)||0, good=$('#j-good').value.trim(), work=$('#j-work').value.trim();
      if(!good&&!work&&!J.feel&&!dur){ toast('Ajoute une durée, un ressenti ou une note.'); break; }
      S.journal.push({id:Date.now(),d:d,dur:dur,feel:J.feel,good:good,work:work});
      persist(); J.feel=0; vProg(); toast('Séance ajoutée au journal.'); break;
    case 'jdel':
      if(!armed(t,'Confirmer ?')) break;
      S.journal=S.journal.filter(function(j){ return j.id!==id; }); persist(); vProg(); break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='fiche-n'){ e.preventDefault(); var b=$('[data-action="fiche-open"]'); if(b) b.click(); }
});
var noteTimer;
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ F.q=t.value; renderList(); return; }
  if(t.id==='ex-q'){ EX.q=t.value; renderFicheList(); return; }
  var k=t.dataset&&t.dataset.in; if(!k) return;
  if(k==='note'){
    var id=+t.dataset.id, val=t.value;
    clearTimeout(noteTimer); noteTimer=setTimeout(function(){
      if(val.trim()) S.notes[id]=val; else delete S.notes[id];
      persist();
      var b=$('.row[data-id="'+id+'"] [data-action="note"]'); if(b) b.classList.toggle('has-note',!!val.trim());
    },250);
  }
  else if(k==='name'){ S.name=t.value.slice(0,40); persist(); }
  else if(k==='jj'){ S.jj[t.dataset.k]=t.value.slice(0,300); persist(); if(t.dataset.k==='a'){ var ph=$('#phrase'); if(ph) ph.textContent=t.value.trim()||PHRASES[0]; } }
  else if(k==='exam'){ S.examDate=/^\d{4}-\d{2}-\d{2}$/.test(t.value)?t.value:''; persist(); }
  else if(k==='target'){ S.target=+t.value; $('#s-target-o').textContent=S.target+' %'; persist(); }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-moment'){ F.moment=t.value; renderList(); return; }
  if(t.dataset&&t.dataset.ch==='jjcheck'){
    if(t.checked) S.jj.done[t.value]=true; else delete S.jj.done[t.value];
    persist(); $$('[data-jjcount]').forEach(function(e){ e.textContent=jjCount(e.dataset.jjcount); }); return;
  }
  if(t.dataset&&t.dataset.ch==='module'){
    var i=S.hidden.indexOf(t.value);
    if(t.checked&&i>=0) S.hidden.splice(i,1); else if(!t.checked&&i<0) S.hidden.push(t.value);
    if(F.moment===t.value) F.moment='all';
    if(Object.keys(S.updated).length) snapshot(); persist(); updModCount(); return;
  }
  if(t.id==='imp-file'&&t.files&&t.files[0]){
    var rd=new FileReader(); rd.onload=function(){ importObj(String(rd.result)); }; rd.onerror=function(){ toast('Lecture du fichier impossible.'); };
    rd.readAsText(t.files[0]); t.value='';
  }
});

/* ---------- Démarrage ---------- */
try{
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('downloads').then(function(x){ DL=x; applyDl(); }).catch(function(){});
  }
}catch(e){}
render();
})();
</script>
